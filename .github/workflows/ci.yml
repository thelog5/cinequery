name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No repository secrets, database URLs, or model keys are supplied to PRs.
      # Database integration tests skip; model tests use a scripted client.
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --audit-level=high
